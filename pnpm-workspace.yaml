# 原生绑定包构建脚本审批（pnpm 默认拒绝运行 postinstall 脚本）
allowBuilds:
  '@parcel/watcher': true   # 文件系统监听原生模块
  esbuild: true             # 打包器原生二进制（Angular CLI / Vite 依赖）
  lmdb: true                # LMDB 原生绑定
  msgpackr-extract: true    # msgpack 原生扩展

# Workspace 成员：4 个 framework 子包（pnpm v11 必须显式声明，否则不识别为 workspace）
packages:
  - 'projects/framework'
  - 'projects/framework-ionic'
  - 'projects/framework-material'
  - 'projects/framework-primeng'

# peerDependency 自动链接到 workspace 同名包
# （3 个 UI 适配包在 peerDeps 声明 @richie696/angular-framework，否则 pnpm 会去 cnb.cool 拉但找不到）
linkWorkspacePackages: true

# 发布时效门控：发布 24h 内的包视为高风险，严格模式下未在白名单则拒绝安装
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  # 自家包 @richie696/capacitor-preferences，可信源（cnb.cool）
  - '@richie696/capacitor-preferences@1.0.1'

# 该私有包的 CNB tarball 元数据无法被 pnpm 11 从公开 registry 复核；
# 只对已人工核验来源和 integrity 的单个包放行，不能扩大到整个 registry。
trustPolicyExclude:
  - '@richie696/capacitor-preferences@1.0.1'

# Angular CLI 22.1.3 当前组合中 prompt adapter 声明了精确的 listr2 10.2.1，
# 而 CLI 实际安装 10.2.2；该规则仅记录已审查的兼容上限，避免把上游工具链告警误判成项目 peer 冲突。
peerDependencyRules:
  allowedVersions:
    listr2: 10.2.2
