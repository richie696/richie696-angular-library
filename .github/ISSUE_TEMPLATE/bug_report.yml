name: Bug report
description: 报告一个可复现的问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索已有 Issue，并尽量提供最小复现信息。
  - type: input
    id: package
    attributes:
      label: 受影响的包或区域
      placeholder: "@richie696/angular-framework 或 framework-material"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: 版本信息
      placeholder: "Angular 22.x, Node.js 20.x, pnpm 10.x"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请提供最小复现步骤或仓库链接。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为和错误信息
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已移除报告中的密钥、令牌和真实用户数据。
          required: true
        - label: 我已搜索过现有 Issue，没有找到相同问题。
          required: true
